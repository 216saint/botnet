version: '3.8'

services:
  c2-server:
    build: ./c2_server
    container_name: c2_brain
    ports:
      - "5000:5000"
    networks:
      - botnet_net

  bot-node:
    build: ./bot_agent
    deploy:
      replicas: 100 # Ajuste para aumentar o tamanho da sua botnet
    environment:
      - C2_URL=http://c2-server:5000
    volumes:
      - ./proxies.json:/proxies.json:ro
    networks:
      - botnet_net
    depends_on:
      - c2-server


networks:
  botnet_net:
    driver: bridge